<!DOCTYPE html><html lang="sw"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Dashboard · ZUNE Admin</title><link rel="stylesheet" href="css/admin.css">
<style>
.row{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;flex-wrap:wrap}.act{display:flex;gap:6px;align-items:center}.act select{width:auto}
.dg{display:grid;gap:12px;grid-template-columns:repeat(2,1fr)}.dg>.card{margin:0;min-width:0;box-shadow:0 1px 3px #0f1b2d12}.dg>*{grid-column:span 2}.dg>.m1{grid-column:span 1}
@media(min-width:900px){.dg{grid-template-columns:repeat(12,1fr)}.dg>.s3{grid-column:span 3}.dg>.s4{grid-column:span 4}.dg>.s5{grid-column:span 5}.dg>.s6{grid-column:span 6}.dg>.s7{grid-column:span 7}.dg>.s8{grid-column:span 8}.dg>.s12{grid-column:1/-1}}
.hd{align-items:center;margin-bottom:8px}.hd b{font-size:16px}.hd a{font-size:12px;color:#2563eb;text-decoration:none}
.sc2{align-items:flex-start}.sc2 b{font-size:22px;line-height:1.2}.sc2 .ic{width:44px;height:44px;border-radius:12px}
.tr{display:block;font-size:12px;font-weight:600;margin-top:2px}.tr.up{color:var(--ok)}.tr.dn{color:var(--bad)}
.qa{display:inline-block;margin:3px;padding:7px 11px;border:1px solid var(--bd);border-radius:8px;color:var(--tx);text-decoration:none;font-size:13px}.qa:hover{border-color:var(--ac)}
.li{display:flex;justify-content:space-between;gap:8px;padding:7px 0;border-bottom:1px solid var(--bd);font-size:14px;align-items:center}.li:last-child{border:0}
.av2{display:inline-grid;place-items:center;width:28px;height:28px;border-radius:50%;background:var(--bg);font-style:normal;margin-right:6px}
.donut{width:110px;height:110px;border-radius:50%;display:grid;place-items:center;flex:none}.donut>div{width:78px;height:78px;border-radius:50%;background:var(--sf);display:grid;place-items:center;text-align:center;font-size:11px;align-content:center}.donut b{font-size:16px}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px}.lg{display:flex;gap:14px;justify-content:flex-end;font-size:12px;color:var(--mu)}
.alert{background:color-mix(in srgb,var(--bad) 9%,var(--sf));border-color:color-mix(in srgb,var(--bad) 25%,var(--bd))}.alert .li{border-color:transparent}
.sc table{min-width:380px}
</style></head><body>
<main id="content">
<div class="ph row"><div><h2>Dashboard</h2><p class="mu" id="up">Overview of your marketplace</p></div>
<div class="act"><select id="rg" aria-label="Kipindi"><option value="7">Last 7 Days</option><option value="30" selected>Last 30 Days</option><option value="90">Last 90 Days</option></select><button id="rf" aria-label="Onyesha upya">↻</button><button id="cu">Customize</button></div></div>
<div id="cz" class="card" hidden></div>
<div class="dg" id="dg"></div>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script><script src="js/config.js"></script><script src="js/layout.js"></script>
<script>
/* 1. SETUP: majina ya tables na columns yako */
const TB={users:'profiles',vendors:'vendors',products:'products',orders:'orders',tx:'transactions',wd:'withdrawals',disputes:'disputes',tickets:'support_tickets',audit:'admin_audit_logs'};
const esc=ZUNE.esc,money=n=>Number(n||0).toLocaleString('en-US'),day=d=>String(d||'').slice(0,10),PG=f=>'pages/'+f;
const k=n=>n>=1e6?(n/1e6).toFixed(1)+'M':n>=1e3?Math.round(n/1e3)+'k':Math.round(n);
const ago=d=>{const m=Math.max(1,Math.round((Date.now()-new Date(d))/6e4));return m<60?m+' min ago':m<1440?Math.round(m/60)+' hr ago':Math.round(m/1440)+' d ago'};
let days=30,cache={};const since=()=>new Date(Date.now()-days*864e5).toISOString();
const sb=()=>{if(!ZUNE.sb)throw new Error('Supabase haijapakiwa');return ZUNE.sb};
const cnt=async(t,fn)=>{let q=sb().from(TB[t]).select('*',{count:'exact',head:true});if(fn)q=fn(q);const r=await q;if(r.error)throw new Error(TB[t]+': '+r.error.message);return r.count||0};
const rows=async(t,c,fn,n=5)=>{let q=sb().from(TB[t]).select(c);if(fn)q=fn(q);const r=await q.limit(n);if(r.error)throw new Error(TB[t]+': '+r.error.message);return r.data||[]};
const newest=q=>q.order('created_at',{ascending:false});
const txs=()=>cache.tx??=rows('tx','reference,type,amount,currency,status,created_at',newest,1000);
const sum=a=>a.reduce((s,x)=>s+(+x.amount||0),0);
const pct=(c,p)=>p>0?Math.round((c-p)/p*100):null;
const grow=async(t,fn)=>{const f=fn||(q=>q),[a,n]=await Promise.all([cnt(t,f),cnt(t,q=>f(q).gte('created_at',since()))]);return [a,pct(a,a-n)]};
const per=async(ty)=>{const a=(await txs()).filter(x=>x.type==ty&&x.status=='completed'),s=Date.now()-days*864e5,e=s-days*864e5,c=sum(a.filter(x=>new Date(x.created_at)>=s)),p=sum(a.filter(x=>{const t=new Date(x.created_at);return t>=e&&t<s}));return [c,pct(c,p)]};
const tbl=(h,r)=>`<div class="sc"><table><thead><tr>${h.map(x=>`<th>${x}</th>`).join('')}</tr></thead><tbody>${r||`<tr><td colspan="${h.length}">Hakuna data.</td></tr>`}</tbody></table></div>`;
const stat=(id,i,col,label,fn,cls)=>({id,title:label,cls,stat:1,run:async()=>{const [v,p]=await fn();return `<div class="sc2 row" style="flex-wrap:nowrap;justify-content:flex-start"><span class="ic" style="background:${col}22;color:${col}">${i}</span><div><b>${typeof v=='number'?money(v):v}</b><span class="mu">${label}</span>${p==null?'':`<span class="tr ${p>=0?'up':'dn'}">${p>=0?'↑':'↓'} ${Math.abs(p)}%</span>`}</div></div>`}});
/* 2. WIDGETS: kuongeza kipengele, ongeza kitu kimoja hapa */
const W=[
stat('users','👥','#2563eb','Total Users',()=>grow('users'),'m1 s3'),
stat('sellers','🏪','#16a34a','Verified Sellers',()=>grow('vendors',q=>q.eq('verification_status','verified')),'m1 s3'),
stat('products','📦','#f97316','Products',()=>grow('products'),'m1 s3'),
stat('orders','🛒','#9333ea','Orders',()=>grow('orders'),'m1 s3'),
stat('sales','💵','#16a34a','Total Sales (TZS)',()=>per('credit'),'s4'),
stat('comm','％','#f97316','Commission (TZS)',()=>per('commission'),'s4'),
stat('pend','⏱','#6366f1','Pending Approvals',async()=>[(await Promise.all([cnt('vendors',q=>q.eq('verification_status','pending')),cnt('products',q=>q.eq('status','pending')),cnt('wd',q=>q.eq('status','pending'))])).reduce((a,b)=>a+b,0),null],'s4'),
{id:'chart',title:'Revenue Overview',cls:'s8',run:async()=>{const a=(await txs()).filter(x=>x.status=='completed'),st=Date.now()-days*864e5,w=days*864e5/4,S=[0,0,0,0],C=[0,0,0,0];a.forEach(x=>{const t=new Date(x.created_at)-st;if(t<0)return;const i=Math.min(3,Math.floor(t/w));if(x.type=='credit')S[i]+=+x.amount||0;if(x.type=='commission')C[i]+=+x.amount||0});const mx=Math.max(...S,...C,1),X=i=>40+i*80,Y=v=>100-v/mx*85,pts=A=>A.map((v,i)=>X(i)+','+Y(v)).join(' '),ln=(A,c)=>`<polyline points="${pts(A)}" style="fill:none;stroke:${c};stroke-width:2.5"/>`+A.map((v,i)=>`<circle cx="${X(i)}" cy="${Y(v)}" r="3" style="fill:${c}"/>`).join(''),g=[0,1,2,3].map(i=>`<line x1="30" x2="290" y1="${100-i*28.3}" y2="${100-i*28.3}" style="stroke:var(--bd)"/><text x="26" y="${103-i*28.3}" text-anchor="end" font-size="8" style="fill:var(--mu)">${k(mx*i/3)}</text>`).join(''),wk=[0,1,2,3].map(i=>`<text x="${X(i)}" y="120" text-anchor="middle" font-size="8" style="fill:var(--mu)">Week ${i+1}</text>`).join('');return `<div class="lg"><span><i class="dot" style="background:var(--ac)"></i>Sales</span><span><i class="dot" style="background:#94a3b8"></i>Commission</span></div><svg viewBox="0 0 300 126" width="100%" role="img" aria-label="Revenue overview">${g}<polygon points="${X(0)},100 ${pts(S)} ${X(3)},100" style="fill:var(--ac);opacity:.1"/>${ln(S,'var(--ac)')}${ln(C,'#94a3b8')}${wk}</svg>`}},
{id:'pipe',title:'Order Pipeline',cls:'s4',run:async()=>{const S=[['Pending','pending','var(--wr)'],['Processing','processing','#2563eb'],['Shipped','shipped','#9333ea'],['Delivered','delivered','var(--ok)'],['Cancelled','cancelled','var(--bad)']],c=await Promise.all(S.map(s=>cnt('orders',q=>q.eq('status',s[1])))),t=c.reduce((a,b)=>a+b,0)||1,p=(c[3]/t*100).toFixed(1);return `<div class="row" style="align-items:center;flex-wrap:nowrap"><div style="flex:1">${S.map((s,i)=>`<div class="li" style="border:0;padding:3px 0"><span><i class="dot" style="background:${s[2]}"></i>${s[0]}</span><b>${money(c[i])}</b></div>`).join('')}</div><div class="donut" style="background:conic-gradient(var(--ok) 0 ${p}%,var(--bd) ${p}% 100%)"><div><b>${p}%</b><span class="mu">Delivered</span></div></div></div>`}},
{id:'act',title:'Recent Activity',cls:'s7',link:'users.html',run:async()=>{const g=await Promise.allSettled([rows('vendors','store_name,created_at',newest,2),rows('orders','id,created_at',newest,2),rows('users','full_name,created_at',newest,2)]).then(r=>r.map(x=>x.status=='fulfilled'?x.value:[])),E=[];g[0].forEach(x=>E.push(['🏪','New seller application from '+x.store_name,x.created_at]));g[1].forEach(x=>E.push(['🧾','Order #'+String(x.id).slice(0,8)+' placed',x.created_at]));g[2].forEach(x=>E.push(['👤','New user registered: '+x.full_name,x.created_at]));E.sort((a,b)=>new Date(b[2])-new Date(a[2]));return E.slice(0,5).map(e=>`<div class="li"><span><i class="av2">${e[0]}</i>${esc(e[1])}</span><span class="mu">${ago(e[2])}</span></div>`).join('')||'<p class="mu">Bado hakuna shughuli.</p>'}},
{id:'alerts',title:'Urgent Alerts',cls:'s5 alert',link:'disputes.html',run:async()=>{const A=[['seller applications pending',cnt('vendors',q=>q.eq('verification_status','pending')),'verification.html'],['dispute(s) require attention',cnt('disputes',q=>q.eq('status','open')),'disputes.html'],['open support tickets',cnt('tickets',q=>q.eq('status','open')),'support-tickets.html'],['withdrawals pending',cnt('wd',q=>q.eq('status','pending')),'wallet.html'],['products awaiting approval',cnt('products',q=>q.eq('status','pending')),'products.html']],v=await Promise.allSettled(A.map(a=>a[1])),h=A.map((a,i)=>v[i].status=='fulfilled'&&v[i].value>0?`<div class="li"><a href="${PG(a[2])}" style="color:inherit;text-decoration:none">⚠️ ${money(v[i].value)} ${a[0]}</a></div>`:'').join('');return h||'<p class="mu">Hakuna dharura kwa sasa ✓</p>'}},
{id:'wallet',title:'Wallet Summary',cls:'s6',link:'wallet.html',run:async()=>{const a=(await txs()).filter(x=>x.status=='completed'),g=t=>sum(a.filter(x=>x.type==t)),cr=g('credit'),de=g('debit'),po=g('payout'),pe=(await txs()).filter(x=>x.status=='pending').length,L=(l,v)=>`<div class="li"><span>${l}</span><b>${money(v)}</b></div>`;return L('Jumla ya credits',cr)+L('Jumla ya debits',de)+L('Malipo kwa wauzaji',po)+L('Kamisheni',g('commission'))+L('Salio la mfumo',cr-de-po)+L('Miamala inayosubiri',pe)+'<p class="mu">Kutoka miamala 1,000 ya karibuni.</p>'}},
{id:'orders',title:'Recent Orders',cls:'s6',link:'orders.html',run:async()=>tbl(['Order','Hali','Kiasi','Tarehe'],(await rows('orders','id,status,total_amount,created_at',newest)).map(o=>`<tr><td>${esc(String(o.id).slice(0,8))}</td><td>${ZUNE.pill(o.status)}</td><td>${money(o.total_amount)}</td><td>${day(o.created_at)}</td></tr>`).join(''))},
{id:'txs',title:'Recent Transactions',cls:'s6',link:'payments.html',run:async()=>tbl(['Ref','Aina','Kiasi','Hali'],(await txs()).slice(0,5).map(t=>`<tr><td>${esc(t.reference)}</td><td>${esc(t.type)}</td><td>${money(t.amount)} ${esc(t.currency||'')}</td><td>${ZUNE.pill(t.status)}</td></tr>`).join(''))},
{id:'audit',title:'Admin Activity',cls:'s6',link:'security.html',run:async()=>(await rows('audit','action,created_at',newest)).map(a=>`<div class="li"><span>${esc(a.action)}</span><span class="mu">${ago(a.created_at)}</span></div>`).join('')||'<p class="mu">Bado hakuna vitendo.</p>'},
{id:'quick',title:'Quick Actions',cls:'s6',run:async()=>[['Users','users'],['Wauzaji','sellers'],['Verification','verification'],['Products','products'],['Orders','orders'],['Payments','payments'],['Wallet','wallet'],['Coupons','coupons'],['Announcements','announcements'],['Support','support-tickets'],['Disputes','disputes'],['Reports','reports']].map(a=>`<a class="qa" href="${PG(a[1])}.html">${a[0]}</a>`).join('')},
{id:'health',title:'System Checklist',cls:'s12',run:async()=>{const ck=async(n,fn)=>{try{await fn();return `<div class="li"><span>${n}</span><span class="pill ok">Sawa</span></div>`}catch(e){return `<div class="li"><span>${n}</span><span class="pill bad">Tatizo</span></div>`}};return (await Promise.all([ck('Database (Supabase)',()=>cnt('users')),ck('Session ya admin',async()=>{if(!(await sb().auth.getSession()).data.session)throw 0}),ck('Miamala inasomeka',()=>txs())])).join('')}}
];
/* 3. ENGINE */
const HK='zune_dash_hidden';let hidden=[];try{hidden=JSON.parse(localStorage.getItem(HK)||'[]')}catch(e){}
const head=w=>w.stat?'':`<div class="row hd"><b>${w.title}</b>${w.link?`<a href="${PG(w.link)}">View all →</a>`:''}</div>`;
const mount=async(w,el)=>{el.innerHTML='<span class="mu">Inapakia...</span>';try{const h=await w.run();el.innerHTML=head(w)+h}catch(e){el.innerHTML=head(w)+`<div class="mu">⚠ ${esc(e.message)}</div>`}};
async function render(){cache={};const g=document.getElementById('dg');g.innerHTML='';await ZUNE.ready;await Promise.all(W.filter(w=>!hidden.includes(w.id)).map(w=>{const el=document.createElement('div');el.className='card '+w.cls;g.appendChild(el);return mount(w,el)}));document.getElementById('up').textContent='Overview of your marketplace · '+new Date().toLocaleTimeString('sw-TZ',{hour:'2-digit',minute:'2-digit'})}
document.getElementById('rg').onchange=e=>{days=+e.target.value;render()};
document.getElementById('rf').onclick=render;
document.getElementById('cu').onclick=()=>{const z=document.getElementById('cz');z.hidden=!z.hidden;z.innerHTML='<b>Chagua vipengele vya kuonyesha</b><div>'+W.map(w=>`<label style="display:inline-flex;gap:6px;margin:6px 12px 0 0;align-items:center"><input type="checkbox" style="width:auto" data-id="${w.id}" ${hidden.includes(w.id)?'':'checked'}>${w.title}</label>`).join('')+'</div>';z.querySelectorAll('input').forEach(i=>i.onchange=()=>{hidden=W.map(w=>w.id).filter(id=>!z.querySelector(`[data-id="${id}"]`).checked);try{localStorage.setItem(HK,JSON.stringify(hidden))}catch(e){}render()})};
render();
</script></body></html>
