
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Users Management | ZUNE Admin</title>

<link rel="stylesheet" href="../css/admin.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../js/config.js"></script>

<style>
:root {
    --green:#15803d;
    --dark:#14532d;
    --light:#f0fdf4;
    --gold:#d4a017;
    --border:#e5ebe6;
    --muted:#718078;
}
* {box-sizing:border-box}
body {
    margin:0;
    background:#f5f7f5;
    color:#17231b;
    font-family:Arial,sans-serif;
}
.page-wrap {
    max-width:1250px;
    margin:auto;
    padding:24px;
}
.page-heading {
    display:flex;
    justify-content:space-between;
    align-items:center;
    flex-wrap:wrap;
    gap:15px;
    margin-bottom:23px;
}
.back-link {
    color:var(--green);
    text-decoration:none;
    font-weight:700;
    font-size:13px;
}
h1 {
    margin:12px 0 6px;
    color:var(--dark);
    font-size:27px;
}
.subtitle {
    color:var(--muted);
    margin:0;
    font-size:14px;
}
.stats {
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:15px;
    margin-bottom:20px;
}
.stat {
    background:white;
    padding:19px;
    border:1px solid var(--border);
    border-radius:13px;
}
.stat small {
    color:var(--muted);
    font-size:12px;
}
.stat h2 {
    color:var(--dark);
    font-size:27px;
    margin:9px 0 0;
}
.panel {
    background:white;
    padding:20px;
    border:1px solid var(--border);
    border-radius:13px;
}
.toolbar {
    display:flex;
    justify-content:space-between;
    align-items:center;
    flex-wrap:wrap;
    gap:12px;
    margin-bottom:18px;
}
.toolbar h2 {
    margin:0;
    font-size:18px;
}
.filters {
    display:flex;
    gap:9px;
    flex-wrap:wrap;
    width:100%;
    margin-bottom:17px;
}
.filters input,.filters select {
    padding:11px;
    border:1px solid #dce5dd;
    border-radius:8px;
    background:white;
    font-size:13px;
    min-width:140px;
    flex:1;
}
.btn {
    border:0;
    border-radius:8px;
    padding:10px 14px;
    font-weight:700;
    font-size:12px;
    cursor:pointer;
}
.primary {
    background:var(--green);
    color:white;
}
.secondary {
    background:#f0fdf4;
    color:var(--dark);
}
.table-wrap {
    overflow-x:auto;
}
table {
    width:100%;
    min-width:850px;
    border-collapse:collapse;
}
th,td {
    padding:14px 12px;
    text-align:left;
    border-bottom:1px solid var(--border);
    font-size:13px;
}
th {
    color:var(--muted);
    background:#f8faf8;
    font-size:12px;
}
.zune-id {
    display:inline-flex;
    align-items:center;
    gap:7px;
    background:#f0fdf4;
    color:var(--dark);
    padding:7px 9px;
    border-radius:7px;
    font-weight:800;
    letter-spacing:1px;
    white-space:nowrap;
}
.copy-btn {
    border:0;
    background:white;
    color:var(--green);
    cursor:pointer;
    font-size:11px;
    font-weight:700;
    padding:5px;
    border-radius:5px;
}
.role {
    display:inline-block;
    background:#f1f5f9;
    color:#334155;
    padding:6px 9px;
    border-radius:20px;
    font-size:11px;
    text-transform:capitalize;
    font-weight:700;
}
.role.admin {
    background:#fff7df;
    color:#946500;
}
.status {
    display:inline-block;
    padding:6px 9px;
    border-radius:20px;
    font-size:11px;
    font-weight:700;
}
.verified {
    background:#dcfce7;
    color:#166534;
}
.unverified {
    background:#fff7ed;
    color:#9a3412;
}
.message {
    padding:12px;
    margin-bottom:15px;
    border-radius:8px;
    background:#f0fdf4;
    color:#166534;
    font-size:13px;
}
.error {
    background:#fee2e2;
    color:#991b1b;
}
.empty {
    text-align:center;
    padding:30px;
    color:var(--muted);
}
@media(max-width:650px) {
    .page-wrap {padding:15px}
    .stats {grid-template-columns:1fr 1fr}
    h1 {font-size:23px}
}
@media(max-width:380px) {
    .stats {grid-template-columns:1fr}
}
</style>
</head>

<body>

<main class="page-wrap">

    <div class="page-heading">
        <div>
            <a class="back-link" href="../index.html">
                ← Back to Dashboard
            </a>
            <h1>Users Management</h1>
            <p class="subtitle">
                Manage registered ZUNE Marketplace accounts.
            </p>
        </div>

        <button class="btn primary" onclick="loadUsers()">
            ↻ Refresh Users
        </button>
    </div>

    <div id="message" class="message">
        Connecting to ZUNE database...
    </div>

    <section class="stats">
        <div class="stat">
            <small>Total Users</small>
            <h2 id="totalUsers">0</h2>
        </div>
        <div class="stat">
            <small>Verified Users</small>
            <h2 id="verifiedUsers">0</h2>
        </div>
        <div class="stat">
            <small>Unverified Users</small>
            <h2 id="unverifiedUsers">0</h2>
        </div>
    </section>

    <section class="panel">

        <div class="toolbar">
            <h2>Registered Users</h2>
            <span id="resultCount"
                style="font-size:12px;color:#718078">
                0 records
            </span>
        </div>

        <div class="filters">
            <input
                id="userSearch"
                type="search"
                placeholder="Search name or ZUNE ID..."
            >

            <select id="roleFilter">
                <option value="all">All Roles</option>
                <option value="admin">Admin</option>
                <option value="buyer">Buyer</option>
                <option value="seller">Seller</option>
            </select>

            <select id="verificationFilter">
                <option value="all">All Verification</option>
                <option value="verified">Verified</option>
                <option value="unverified">Not Verified</option>
            </select>
        </div>

        <div class="table-wrap">
            <table>
                <thead>
                    <tr>
                        <th>Full Name</th>
                        <th>ZUNE ID</th>
                        <th>Role</th>
                        <th>Verification</th>
                        <th>Joined</th>
                    </tr>
                </thead>

                <tbody id="usersTable">
                    <tr>
                        <td colspan="5" class="empty">
                            Loading users...
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>

    </section>
</main>

<script>
const client = window.supabase.createClient(
    window.SUPABASE_URL,
    window.SUPABASE_ANON_KEY
);

const $ = id => document.getElementById(id);

let users = [];

function escapeHTML(value) {
    return String(value ?? "").replace(/[&<>"']/g, char => ({
        "&":"&amp;",
        "<":"&lt;",
        ">":"&gt;",
        '"':"&quot;",
        "'":"&#39;"
    })[char]);
}

function showMessage(text, isError=false) {
    const box = $("message");
    box.textContent = text;
    box.className = isError ? "message error" : "message";
}

async function checkAdmin() {
    const {data:{session},error} =
        await client.auth.getSession();

    if (error) throw error;

    if (!session) {
        location.href = "../login.html";
        return false;
    }

    const {data:profile,error:profileError} = await client
        .from("profiles")
        .select("role")
        .eq("id",session.user.id)
        .single();

    if (profileError) throw profileError;

    if (profile?.role !== "admin") {
        document.body.innerHTML = `
            <div style="padding:40px;text-align:center;font-family:Arial">
                <h2>Access Denied</h2>
                <p>Admin permission is required.</p>
                <a href="../login.html">Return to login</a>
            </div>`;
        return false;
    }

    return true;
}

async function loadUsers() {
    $("usersTable").innerHTML = `
        <tr><td colspan="5" class="empty">
            Loading users...
        </td></tr>`;

    try {
        const {data,error} = await client
            .from("profiles")
            .select(`
                id,
                full_name,
                zune_id,
                role,
                is_verified,
                created_at
            `)
            .order("created_at",{ascending:false});

        if (error) throw error;

        users = data || [];

        updateStats();
        renderUsers();

        showMessage("Users loaded successfully.");

    } catch(error) {
        console.error("Users loading error:",error);

        $("usersTable").innerHTML = `
            <tr><td colspan="5" class="empty">
                Could not load user records.
            </td></tr>`;

        showMessage(
            "Unable to load users: " + error.message,
            true
        );
    }
}

function updateStats() {
    $("totalUsers").textContent = users.length;

    $("verifiedUsers").textContent =
        users.filter(u => u.is_verified === true).length;

    $("unverifiedUsers").textContent =
        users.filter(u => u.is_verified !== true).length;
}

function renderUsers() {
    const term = $("userSearch").value.trim().toLowerCase();
    const role = $("roleFilter").value;
    const verification = $("verificationFilter").value;

    const filtered = users.filter(user => {
        const name = (user.full_name || "").toLowerCase();
        const id = (user.zune_id || "").toLowerCase();
        const userRole = (user.role || "").toLowerCase();

        const matchesSearch =
            name.includes(term) || id.includes(term);

        const matchesRole =
            role === "all" || userRole === role;

        const matchesVerification =
            verification === "all" ||
            (verification === "verified" && user.is_verified) ||
            (verification === "unverified" && !user.is_verified);

        return matchesSearch &&
            matchesRole &&
            matchesVerification;
    });

    $("resultCount").textContent =
        filtered.length + " records";

    if (!filtered.length) {
        $("usersTable").innerHTML = `
            <tr><td colspan="5" class="empty">
                No matching users found.
            </td></tr>`;
        return;
    }

    $("usersTable").innerHTML = filtered.map(user => {
        const role = (user.role || "buyer").toLowerCase();

        return `
        <tr>
            <td>
                <strong>${escapeHTML(user.full_name || "Unnamed user")}</strong>
            </td>

            <td>
                ${
                    user.zune_id
                    ? `<span class="zune-id">
                        ${escapeHTML(user.zune_id)}
                        <button
                            class="copy-btn"
                            data-copy-id="${escapeHTML(user.zune_id)}"
                            title="Copy ZUNE ID">
                            Copy
                        </button>
                    </span>`
                    : `<span style="color:#999">Not assigned</span>`
                }
            </td>

            <td>
                <span class="role ${role === "admin" ? "admin" : ""}">
                    ${escapeHTML(role)}
                </span>
            </td>

            <td>
                <span class="status ${
                    user.is_verified ? "verified" : "unverified"
                }">
                    ${user.is_verified ? "Verified" : "Not verified"}
                </span>
            </td>

            <td>
                ${user.created_at
                    ? escapeHTML(new Date(user.created_at).toLocaleDateString())
                    : "—"}
            </td>
        </tr>`;
    }).join("");
}

// Copy ZUNE ID
$("usersTable").addEventListener("click", async event => {
    const button = event.target.closest("[data-copy-id]");
    if (!button) return;

    const id = button.dataset.copyId;

    try {
        await navigator.clipboard.writeText(id);
        button.textContent = "Copied!";
        setTimeout(() => button.textContent = "Copy",1500);
    } catch(error) {
        showMessage("Could not copy ID. Please copy it manually.",true);
    }
});

// Search and filters
$("userSearch").addEventListener("input",renderUsers);
$("roleFilter").addEventListener("change",renderUsers);
$("verificationFilter").addEventListener("change",renderUsers);

async function initialize() {
    try {
        const allowed = await checkAdmin();
        if (!allowed) return;

        await loadUsers();

    } catch(error) {
        console.error(error);
        showMessage("Admin access error: " + error.message,true);
    }
}

initialize();
</script>

</body>
</html>
