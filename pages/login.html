<!doctype html><html lang="sw"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#071c18"><title>Ingia · ZUNE Admin</title><link rel="stylesheet" href="css/admin.css"><style>body{display:grid;place-items:center;padding:20px}.login-card{width:min(440px,100%);background:#102c24;border:1px solid rgba(225,190,110,.18);border-radius:22px;padding:28px;box-shadow:0 25px 80px #0008}.login-brand{font:800 24px Manrope;letter-spacing:3px;color:#f0d99c}.login-card p{color:#9aada4;font-size:12px;line-height:1.6}.login-card label{display:block;margin:16px 0 7px;color:#f0d99c;font-size:11px}.login-card input{width:100%;padding:13px;border-radius:10px;border:1px solid rgba(225,190,110,.2);background:#081e18;color:white}.login-card button{width:100%;margin-top:18px;padding:13px;border:0;border-radius:10px;background:linear-gradient(135deg,#e9d18f,#bd9147);font-weight:800;color:#14251d}.login-error{color:#f08d8e!important;margin-top:12px}</style></head><body><main class="login-card"><div class="login-brand">ZUNE</div><p>PREMIUM ADMIN CONTROL CENTER</p><h1>Ingia Admin Mkuu</h1><p>Ingia kwa akaunti yenye role ya <b>admin</b> kwenye profiles.</p><form id="adminLoginForm"><label for="email">Email</label><input id="email" type="email" autocomplete="username" required><label for="password">Password</label><input id="password" type="password" autocomplete="current-password" required><button id="loginButton">Ingia kwenye mfumo</button><p id="loginMessage" role="alert"></p></form></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="js/config.js"></script><script src="js/login.js"></script></body></html>
