<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Products Management | ZUNE Admin</title>
  <link rel="stylesheet" href="../css/admin.css">

  <style>
    .page-wrap { padding:25px; }
    .page-heading {
      display:flex;
      justify-content:space-between;
      align-items:center;
      flex-wrap:wrap;
      gap:15px;
      margin-bottom:25px;
    }
    .back-link { color:#15803d; text-decoration:none; font-weight:600; }
    .search-box {
      width:100%; max-width:320px; padding:12px;
      border:1px solid #ddd; border-radius:9px;
    }
    .message {
      padding:14px; background:#fff5df; color:#805500;
      border-radius:9px; margin-bottom:18px; white-space:pre-wrap;
    }
    .panel { background:white; padding:18px; border-radius:14px; overflow-x:auto; }
    table { width:100%; min-width:850px; border-collapse:collapse; }
    th,td { padding:14px; text-align:left; border-bottom:1px solid #eee; }
    th { color:#647067; font-size:13px; }
    .empty { text-align:center; padding:25px; color:#777; }
    .price { color:#15803d; font-weight:700; }
  </style>
</head>

<body>
  <main class="page-wrap">

    <div class="page-heading">
      <div>
        <a class="back-link" href="../index.html">← Back to Dashboard</a>
        <h1>Products Management</h1>
        <p>View products listed on ZUNE Marketplace.</p>
      </div>

      <input
        id="productSearch"
        class="search-box"
        type="search"
        placeholder="Search products..."
      >
    </div>

    <div id="message" class="message">Loading products...</div>

    <section class="panel">
      <table>
        <thead>
          <tr>
            <th>Product</th>
            <th>Price</th>
            <th>Stock</th>
            <th>Vendor ID</th>
            <th>Date Added</th>
          </tr>
        </thead>

        <tbody id="productsTable">
          <tr><td colspan="5" class="empty">Loading...</td></tr>
        </tbody>
      </table>
    </section>

  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../js/config.js"></script>

  <script>
    document.addEventListener("DOMContentLoaded", async () => {
      const message = document.getElementById("message");
      const table = document.getElementById("productsTable");
      const search = document.getElementById("productSearch");

      let products = [];

      function escapeHTML(value) {
        return String(value ?? "").replace(/[&<>"']/g, char => ({
          "&": "&amp;",
          "<": "&lt;",
          ">": "&gt;",
          '"': "&quot;",
          "'": "&#39;"
        })[char]);
      }

      function renderProducts(list) {
        if (!list.length) {
          table.innerHTML =
            '<tr><td colspan="5" class="empty">No products found.</td></tr>';
          return;
        }

        table.innerHTML = list.map(product => `
          <tr>
            <td>${escapeHTML(product.title || "Untitled product")}</td>
            <td class="price">${escapeHTML(product.price ?? "—")}</td>
            <td>${escapeHTML(product.stock_quantity ?? "—")}</td>
            <td>${escapeHTML(product.vendor_id || "—")}</td>
            <td>${product.created_at
              ? escapeHTML(new Date(product.created_at).toLocaleDateString())
              : "—"}</td>
          </tr>
        `).join("");
      }

      try {
        if (
          !window.supabase ||
          !window.SUPABASE_URL ||
          !window.SUPABASE_ANON_KEY
        ) {
          throw new Error("Supabase configuration is missing.");
        }

        const client = window.supabase.createClient(
          window.SUPABASE_URL,
          window.SUPABASE_ANON_KEY
        );

        const { data: sessionData, error: sessionError } =
          await client.auth.getSession();

        if (sessionError) throw sessionError;

        if (!sessionData.session) {
          window.location.href = "../login.html";
          return;
        }

        const { data: profile, error: profileError } = await client
          .from("profiles")
          .select("role")
          .eq("id", sessionData.session.user.id)
          .single();

        if (profileError || !profile || profile.role !== "admin") {
          await client.auth.signOut();
          window.location.href = "../login.html";
          return;
        }

        const { data, error } = await client
          .from("products")
          .select("id, vendor_id, title, price, stock_quantity, created_at")
          .order("created_at", { ascending: false });

        if (error) throw error;

        products = data || [];

        message.textContent = "Total products: " + products.length;
        renderProducts(products);

        search.addEventListener("input", () => {
          const term = search.value.toLowerCase();

          renderProducts(products.filter(product =>
            [
              product.title,
              product.vendor_id
            ].join(" ").toLowerCase().includes(term)
          ));
        });

      } catch (error) {
        console.error("Products page error:", error);

        message.textContent =
          "Unable to load products: " +
          (error.message || "Unknown error") +
          (error.code ? " | Code: " + error.code : "") +
          (error.hint ? " | Hint: " + error.hint : "");

        table.innerHTML =
          '<tr><td colspan="5" class="empty">Could not load product records.</td></tr>';
      }
    });
  </script>
</body>
</html>
