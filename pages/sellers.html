<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sellers Management | ZUNE Admin</title>
  <link rel="stylesheet" href="../css/admin.css">

  <style>
    .page-wrap { padding:25px; }
    .page-heading {
      display:flex;
      justify-content:space-between;
      align-items:center;
      flex-wrap:wrap;
      gap:15px;
      margin-bottom:25px;
    }
    .back-link {
      color:#15803d;
      text-decoration:none;
      font-weight:600;
    }
    .search-box {
      width:100%;
      max-width:320px;
      padding:12px;
      border:1px solid #ddd;
      border-radius:9px;
    }
    .message {
      padding:14px;
      background:#fff5df;
      color:#805500;
      border-radius:9px;
      margin-bottom:18px;
    }
    .panel {
      background:white;
      padding:18px;
      border-radius:14px;
      overflow-x:auto;
    }
    table {
      width:100%;
      min-width:850px;
      border-collapse:collapse;
    }
    th,td {
      padding:14px;
      text-align:left;
      border-bottom:1px solid #eee;
    }
    th { color:#647067; font-size:13px; }
    .status {
      display:inline-block;
      padding:6px 10px;
      border-radius:20px;
      background:#e8f7ed;
      color:#15803d;
      font-size:12px;
    }
    .empty { text-align:center; padding:25px; color:#777; }
  </style>
</head>

<body>
  <main class="page-wrap">

    <div class="page-heading">
      <div>
        <a class="back-link" href="../index.html">← Back to Dashboard</a>
        <h1>Sellers Management</h1>
        <p>Manage ZUNE Marketplace seller applications.</p>
      </div>

      <input
        id="sellerSearch"
        class="search-box"
        type="search"
        placeholder="Search sellers..."
      >
    </div>

    <div id="message" class="message">Loading seller applications...</div>

    <section class="panel">
      <table>
        <thead>
          <tr>
            <th>Store Name</th>
            <th>Owner</th>
            <th>Phone</th>
            <th>Location</th>
            <th>Category</th>
            <th>Status</th>
          </tr>
        </thead>

        <tbody id="sellersTable">
          <tr>
            <td colspan="6" class="empty">Loading...</td>
          </tr>
        </tbody>
      </table>
    </section>

  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../js/config.js"></script>

  <script>
    document.addEventListener("DOMContentLoaded", async () => {
      const message = document.getElementById("message");
      const table = document.getElementById("sellersTable");
      const search = document.getElementById("sellerSearch");

      let sellers = [];

      function escapeHTML(value) {
        return String(value ?? "").replace(/[&<>"']/g, char => ({
          "&": "&amp;",
          "<": "&lt;",
          ">": "&gt;",
          '"': "&quot;",
          "'": "&#39;"
        })[char]);
      }

      function renderSellers(list) {
        if (!list.length) {
          table.innerHTML =
            '<tr><td colspan="6" class="empty">No seller applications found.</td></tr>';
          return;
        }

        table.innerHTML = list.map(seller => {
          const location = [
            seller.city,
            seller.district,
            seller.region,
            seller.country
          ].filter(Boolean).join(", ");

          return `
            <tr>
              <td>${escapeHTML(seller.store_name || seller.business_name || "Unnamed store")}</td>
              <td>${escapeHTML(seller.owner_name || "—")}</td>
              <td>${escapeHTML(seller.phone || "—")}</td>
              <td>${escapeHTML(location || "—")}</td>
              <td>${escapeHTML(seller.category || "—")}</td>
              <td><span class="status">${escapeHTML(seller.status || "Pending")}</span></td>
            </tr>
          `;
        }).join("");
      }

      try {
        if (
          !window.supabase ||
          !window.SUPABASE_URL ||
          !window.SUPABASE_ANON_KEY
        ) {
          throw new Error("Supabase configuration is missing.");
        }

        const client = window.supabase.createClient(
          window.SUPABASE_URL,
          window.SUPABASE_ANON_KEY
        );

        const { data: sessionData, error: sessionError } =
          await client.auth.getSession();

        if (sessionError) throw sessionError;

        if (!sessionData.session) {
          window.location.href = "../login.html";
          return;
        }

        const { data: profile, error: profileError } = await client
          .from("profiles")
          .select("role")
          .eq("id", sessionData.session.user.id)
          .single();

        if (profileError || !profile || profile.role !== "admin") {
          await client.auth.signOut();
          window.location.href = "../login.html";
          return;
        }

        const { data, error } = await client
          .from("seller_applications")
          .select("store_name, business_name, owner_name, phone, country, city, district, region, category, status")
          .order("store_name", { ascending: true });

        if (error) throw error;

        sellers = data || [];

        message.textContent =
          "Total seller applications: " + sellers.length;

        renderSellers(sellers);

        search.addEventListener("input", () => {
          const term = search.value.toLowerCase();

          const filtered = sellers.filter(seller => {
            const searchable = [
              seller.store_name,
              seller.business_name,
              seller.owner_name,
              seller.phone,
              seller.city,
              seller.country,
              seller.status
            ].join(" ").toLowerCase();

            return searchable.includes(term);
          });

          renderSellers(filtered);
        });

      } catch (error) {
        console.error("Sellers page error:", error);

        message.textContent =
          "Unable to load seller applications: " + error.message;

        table.innerHTML =
          '<tr><td colspan="6" class="empty">Could not load seller records.</td></tr>';
      }
    });
  </script>
</body>
</html>
