<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Sellers Management | ZUNE Admin</title>

  <link rel="stylesheet" href="../css/admin.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../js/config.js"></script>

  <style>
    :root {
      --green: #15803d;
      --dark: #14532d;
      --light: #eaf7ee;
      --gold: #d4a72c;
      --muted: #647067;
      --border: #e5eae6;
      --red: #b52e28;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #f5f8f5;
      color: #24352a;
      font-family: Arial, sans-serif;
    }

    button, input, select {
      font: inherit;
    }

    .page-wrap {
      width: 100%;
      max-width: 1500px;
      margin: auto;
      padding: 24px;
    }

    .page-heading {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 18px;
      margin-bottom: 24px;
    }

    .back-link {
      color: var(--green);
      text-decoration: none;
      font-weight: 700;
      font-size: 13px;
    }

    .page-heading h1 {
      margin: 12px 0 6px;
      color: #173d27;
      font-size: 28px;
    }

    .page-heading p {
      margin: 0;
      color: var(--muted);
      font-size: 14px;
    }

    .toolbar {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 9px;
    }

    .search-box,
    .filter {
      min-height: 44px;
      padding: 11px 13px;
      border: 1px solid #dce5de;
      border-radius: 10px;
      background: white;
      outline: none;
    }

    .search-box {
      width: 240px;
    }

    .search-box:focus,
    .filter:focus {
      border-color: var(--green);
    }

    .btn {
      border: 0;
      border-radius: 10px;
      padding: 12px 16px;
      background: var(--green);
      color: white;
      font-weight: 700;
      cursor: pointer;
    }

    .btn:hover {
      background: var(--dark);
    }

    .btn:disabled {
      opacity: .55;
      cursor: not-allowed;
    }

    .stats {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 15px;
      margin-bottom: 22px;
    }

    .stat-card {
      background: white;
      padding: 19px;
      border: 1px solid var(--border);
      border-radius: 15px;
      box-shadow: 0 3px 12px rgba(0,0,0,.025);
    }

    .stat-card small {
      display: block;
      color: var(--muted);
      margin-bottom: 10px;
    }

    .stat-card strong {
      font-size: 27px;
      color: #173d27;
    }

    .stat-card .gold {
      color: #a87908;
    }

    .stat-card .green {
      color: var(--green);
    }

    .stat-card .red {
      color: var(--red);
    }

    .message {
      display: none;
      padding: 14px 16px;
      background: #edf7ef;
      color: #176534;
      border-radius: 10px;
      margin-bottom: 17px;
      overflow-wrap: anywhere;
      font-size: 14px;
    }

    .message.show {
      display: block;
    }

    .message.error {
      background: #fff0ef;
      color: #a52b23;
    }

    .message.info {
      background: #eef5ff;
      color: #24558a;
    }

    .panel {
      background: white;
      padding: 18px;
      border: 1px solid var(--border);
      border-radius: 15px;
      box-shadow: 0 3px 12px rgba(0,0,0,.025);
    }

    .panel-heading {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 10px;
      margin-bottom: 15px;
    }

    .panel-heading h2 {
      margin: 0;
      color: #173d27;
      font-size: 18px;
    }

    .record-count {
      color: var(--muted);
      font-size: 13px;
    }

    .table-wrap {
      overflow-x: auto;
    }

    table {
      width: 100%;
      min-width: 1100px;
      border-collapse: collapse;
    }

    th, td {
      padding: 14px 12px;
      text-align: left;
      border-bottom: 1px solid #edf0ed;
      vertical-align: middle;
    }

    th {
      color: #647067;
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: .4px;
      background: #fafcfb;
      white-space: nowrap;
    }

    td {
      font-size: 13px;
      color: #34443a;
    }

    tbody tr:hover {
      background: #f8fcf9;
    }

    .store-name {
      font-weight: 700;
      color: #174c2c;
    }

    .status {
      display: inline-block;
      padding: 6px 10px;
      border-radius: 20px;
      font-size: 11px;
      font-weight: 700;
      text-transform: capitalize;
      background: #f0f2f0;
      color: #526057;
      white-space: nowrap;
    }

    .status.pending {
      background: #fff5dc;
      color: #946200;
    }

    .status.approved {
      background: #e5f7eb;
      color: #147239;
    }

    .status.rejected {
      background: #ffebea;
      color: #b52e28;
    }

    .action-group {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 6px;
    }

    .action-btn {
      border: 0;
      border-radius: 7px;
      padding: 8px 10px;
      font-size: 11px;
      font-weight: 700;
      cursor: pointer;
      white-space: nowrap;
    }

    .approve-btn {
      background: #e5f7eb;
      color: #147239;
    }

    .activate-btn {
      background: #dcefe3;
      color: #14532d;
      border: 1px solid #b9ddc5;
    }

    .reject-btn {
      background: #ffebea;
      color: #b52e28;
    }

    .view-btn {
      background: #edf3f8;
      color: #315b7d;
    }

    .action-btn:hover {
      filter: brightness(.96);
    }

    .action-btn:disabled {
      opacity: .5;
      cursor: not-allowed;
    }

    .empty {
      text-align: center;
      padding: 35px 15px;
      color: #78827b;
    }

    /* DETAILS MODAL */

    .modal {
      position: fixed;
      inset: 0;
      z-index: 9999;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 16px;
      background: rgba(10, 30, 17, .55);
    }

    .modal.show {
      display: flex;
    }

    .modal-card {
      width: 100%;
      max-width: 580px;
      max-height: 90vh;
      overflow-y: auto;
      background: white;
      border-radius: 17px;
      padding: 22px;
      box-shadow: 0 15px 50px rgba(0,0,0,.18);
    }

    .modal-heading {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 18px;
    }

    .modal-heading h2 {
      margin: 0;
      color: #173d27;
      font-size: 20px;
    }

    .close-btn {
      border: 0;
      background: #f0f3f0;
      width: 35px;
      height: 35px;
      border-radius: 50%;
      cursor: pointer;
      font-size: 19px;
    }

    .detail-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 13px;
    }

    .detail-item {
      padding: 12px;
      border: 1px solid var(--border);
      border-radius: 10px;
      min-width: 0;
    }

    .detail-item small {
      display: block;
      color: var(--muted);
      margin-bottom: 6px;
      font-size: 11px;
    }

    .detail-item strong {
      display: block;
      color: #244631;
      font-size: 13px;
      overflow-wrap: anywhere;
    }

    .modal-actions {
      display: flex;
      justify-content: flex-end;
      flex-wrap: wrap;
      gap: 9px;
      margin-top: 20px;
    }

    .modal-actions button {
      border: 0;
      border-radius: 9px;
      padding: 11px 15px;
      font-weight: 700;
      cursor: pointer;
    }

    .modal-approve {
      background: var(--green);
      color: white;
    }

    .modal-activate {
      background: #dcefe3;
      color: #14532d;
    }

    .modal-reject {
      background: #ffebea;
      color: var(--red);
    }

    @media(max-width: 850px) {
      .stats {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }
    }

    @media(max-width: 520px) {
      .page-wrap {
        padding: 15px;
      }

      .page-heading h1 {
        font-size: 23px;
      }

      .toolbar {
        width: 100%;
      }

      .search-box {
        width: 100%;
      }

      .filter,
      .toolbar .btn {
        flex: 1;
      }

      .stat-card {
        padding: 14px;
      }

      .stat-card strong {
        font-size: 23px;
      }

      .panel {
        padding: 12px;
      }

      .detail-grid {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>

<body>

<main class="page-wrap">

  <header class="page-heading">
    <div>
      <a class="back-link" href="../index.html">
        ← Back to Dashboard
      </a>

      <h1>Sellers Management</h1>

      <p>
        Review, approve and manage ZUNE Marketplace seller applications.
      </p>
    </div>

    <div class="toolbar">
      <input
        id="sellerSearch"
        class="search-box"
        type="search"
        placeholder="Search sellers..."
        aria-label="Search sellers"
      >

      <select
        id="statusFilter"
        class="filter"
        aria-label="Filter sellers by status"
      >
        <option value="all">All statuses</option>
        <option value="pending">Pending</option>
        <option value="approved">Approved</option>
        <option value="rejected">Rejected</option>
      </select>

      <button
        class="btn"
        id="refreshBtn"
        type="button"
      >
        ↻ Refresh
      </button>
    </div>
  </header>

  <section class="stats">

    <div class="stat-card">
      <small>Total Applications</small>
      <strong id="totalCount">—</strong>
    </div>

    <div class="stat-card">
      <small>Pending</small>
      <strong class="gold" id="pendingCount">—</strong>
    </div>

    <div class="stat-card">
      <small>Approved</small>
      <strong class="green" id="approvedCount">—</strong>
    </div>

    <div class="stat-card">
      <small>Rejected</small>
      <strong class="red" id="rejectedCount">—</strong>
    </div>

  </section>

  <div
    id="message"
    class="message"
    role="status"
    aria-live="polite"
  ></div>

  <section class="panel">

    <div class="panel-heading">
      <h2>Seller Applications</h2>

      <span class="record-count" id="recordCount">
        0 records
      </span>
    </div>

    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th>Store Name</th>
            <th>Owner</th>
            <th>Phone</th>
            <th>Location</th>
            <th>Category</th>
            <th>Status</th>
            <th>Actions</th>
          </tr>
        </thead>

        <tbody id="sellersTable">
          <tr>
            <td colspan="7" class="empty">
              Loading seller applications...
            </td>
          </tr>
        </tbody>
      </table>
    </div>

  </section>

</main>

<!-- SELLER DETAILS MODAL -->

<div
  class="modal"
  id="sellerModal"
  role="dialog"
  aria-modal="true"
  aria-labelledby="modalTitle"
>
  <div class="modal-card">

    <div class="modal-heading">
      <h2 id="modalTitle">Seller Details</h2>

      <button
        class="close-btn"
        id="closeModalBtn"
        type="button"
        aria-label="Close"
      >
        ×
      </button>
    </div>

    <div
      class="detail-grid"
      id="sellerDetails"
    ></div>

    <div class="modal-actions" id="modalActions"></div>

  </div>
</div><script>
document.addEventListener("DOMContentLoaded", async () => {

  // =====================================================
  // 1. ELEMENTS AND VARIABLES
  // =====================================================

  const message = document.getElementById("message");
  const table = document.getElementById("sellersTable");
  const search = document.getElementById("sellerSearch");
  const statusFilter = document.getElementById("statusFilter");
  const refreshBtn = document.getElementById("refreshBtn");

  const modal = document.getElementById("sellerModal");
  const closeModalBtn = document.getElementById("closeModalBtn");
  const sellerDetails = document.getElementById("sellerDetails");
  const modalActions = document.getElementById("modalActions");

  let client = null;
  let sellers = [];
  let profileRoles = new Map();
  let isUpdating = false;

  // =====================================================
  // 2. SECURITY AND UTILITIES
  // =====================================================

  function escapeHTML(value) {
    return String(value ?? "").replace(/[&<>"']/g, char => ({
      "&": "&amp;",
      "<": "&lt;",
      ">": "&gt;",
      '"': "&quot;",
      "'": "&#39;"
    })[char]);
  }

  function normalizedStatus(status) {
    return String(status || "pending")
      .trim()
      .toLowerCase();
  }

  function showMessage(text, type = "success") {
    message.textContent = text;
    message.className = `message show ${type}`;
  }

  function hideMessage() {
    message.textContent = "";
    message.className = "message";
  }

  // =====================================================
  // 3. VERIFY ADMIN SESSION
  // =====================================================

  async function verifyAdmin() {
    const {
      data: sessionData,
      error: sessionError
    } = await client.auth.getSession();

    if (sessionError) {
      throw sessionError;
    }

    const user = sessionData.session?.user;

    if (!user) {
      window.location.href = "../login.html";
      return false;
    }

    const {
      data: profile,
      error: profileError
    } = await client
      .from("profiles")
      .select("role")
      .eq("id", user.id)
      .single();

    if (profileError) {
      throw profileError;
    }

    if (!profile || profile.role !== "admin") {
      await client.auth.signOut();
      window.location.href = "../login.html";
      return false;
    }

    return true;
  }

  // =====================================================
  // 4. LOAD PROFILE ROLES
  // =====================================================

  async function loadProfileRoles() {
    const userIds = [
      ...new Set(
        sellers
          .map(seller => seller.user_id)
          .filter(Boolean)
      )
    ];

    profileRoles = new Map();

    if (!userIds.length) return;

    const {
      data,
      error
    } = await client
      .from("profiles")
      .select("id, role")
      .in("id", userIds);

    if (error) {
      throw error;
    }

    (data || []).forEach(profile => {
      profileRoles.set(
        profile.id,
        profile.role
      );
    });
  }

  // =====================================================
  // 5. UPDATE STATISTICS
  // =====================================================

  function updateStats() {
    document.getElementById("totalCount").textContent =
      sellers.length;

    document.getElementById("pendingCount").textContent =
      sellers.filter(s =>
        normalizedStatus(s.status) === "pending"
      ).length;

    document.getElementById("approvedCount").textContent =
      sellers.filter(s =>
        normalizedStatus(s.status) === "approved"
      ).length;

    document.getElementById("rejectedCount").textContent =
      sellers.filter(s =>
        normalizedStatus(s.status) === "rejected"
      ).length;
  }

  // =====================================================
  // 6. RENDER SELLER APPLICATIONS
  // =====================================================

  function renderSellers(list) {
    document.getElementById("recordCount").textContent =
      `${list.length} record${list.length === 1 ? "" : "s"}`;

    if (!list.length) {
      table.innerHTML = `
        <tr>
          <td colspan="7" class="empty">
            No seller applications match your search.
          </td>
        </tr>
      `;
      return;
    }

    table.innerHTML = list.map(seller => {
      const status = normalizedStatus(seller.status);
      const role = profileRoles.get(seller.user_id);

      const location = [
        seller.city,
        seller.district,
        seller.region,
        seller.country
      ].filter(Boolean).join(", ");

      let actions = `
        <button
          class="action-btn view-btn"
          type="button"
          data-action="view"
          data-id="${escapeHTML(seller.id)}">
          View
        </button>
      `;

      if (status === "pending") {
        actions += `
          <button
            class="action-btn approve-btn"
            type="button"
            data-action="approve"
            data-id="${escapeHTML(seller.id)}">
            ✓ Approve
          </button>

          <button
            class="action-btn reject-btn"
            type="button"
            data-action="reject"
            data-id="${escapeHTML(seller.id)}">
            ✕ Reject
          </button>
        `;
      }

      if (status === "approved" && role !== "vendor") {
        actions += `
          <button
            class="action-btn activate-btn"
            type="button"
            data-action="approve"
            data-id="${escapeHTML(seller.id)}">
            Activate Vendor
          </button>
        `;
      }

      if (status === "approved" && role === "vendor") {
        actions += `
          <span class="status approved">
            Vendor Active
          </span>
        `;
      }

      return `
        <tr>
          <td>
            <span class="store-name">
              ${escapeHTML(
                seller.store_name ||
                seller.business_name ||
                "Unnamed store"
              )}
            </span>
          </td>

          <td>${escapeHTML(seller.owner_name || "—")}</td>

          <td>${escapeHTML(seller.phone || "—")}</td>

          <td>${escapeHTML(location || "—")}</td>

          <td>${escapeHTML(seller.category || "—")}</td>

          <td>
            <span class="status ${escapeHTML(status)}">
              ${escapeHTML(status)}
            </span>
          </td>

          <td>
            <div class="action-group">
              ${actions}
            </div>
          </td>
        </tr>
      `;
    }).join("");
  }

  // =====================================================
  // 7. SEARCH AND FILTER
  // =====================================================

  function applyFilters() {
    const term = search.value.trim().toLowerCase();
    const selectedStatus = statusFilter.value;

    const filtered = sellers.filter(seller => {
      const searchable = [
        seller.store_name,
        seller.business_name,
        seller.owner_name,
        seller.phone,
        seller.email,
        seller.city,
        seller.district,
        seller.region,
        seller.country,
        seller.category,
        seller.status
      ].join(" ").toLowerCase();

      const matchesSearch =
        searchable.includes(term);

      const matchesStatus =
        selectedStatus === "all" ||
        normalizedStatus(seller.status) === selectedStatus;

      return matchesSearch && matchesStatus;
    });

    renderSellers(filtered);
  }

  // =====================================================
  // 8. LOAD SELLER APPLICATIONS
  // =====================================================

  async function loadSellers() {
    refreshBtn.disabled = true;
    refreshBtn.textContent = "Loading...";

    showMessage(
      "Loading seller applications...",
      "info"
    );

    try {
      const isAdmin = await verifyAdmin();

      if (!isAdmin) return;

      const {
        data,
        error
      } = await client
        .from("seller_applications")
        .select(`
          id,
          user_id,
          store_name,
          business_name,
          owner_name,
          phone,
          email,
          country,
          city,
          district,
          region,
          street,
          address,
          category,
          tin_number,
          id_type,
          id_number,
          status,
          created_at
        `)
        .order("created_at", {
          ascending: false
        });

      if (error) {
        throw error;
      }

      sellers = data || [];

      await loadProfileRoles();

      updateStats();
      applyFilters();

      showMessage(
        `Successfully loaded ${sellers.length} seller application(s).`
      );

    } catch (error) {
      console.error(
        "ZUNE Sellers loading error:",
        error
      );

      showMessage(
        "Unable to load applications: " +
        (error.message || "Unknown error"),
        "error"
      );

      table.innerHTML = `
        <tr>
          <td colspan="7" class="empty">
            Could not load seller applications.
          </td>
        </tr>
      `;

    } finally {
      refreshBtn.disabled = false;
      refreshBtn.textContent = "↻ Refresh";
    }
  }

  // =====================================================
  // 9. SELLER DETAILS
  // =====================================================

  function addDetail(label, value) {
    return `
      <div class="detail-item">
        <small>${escapeHTML(label)}</small>
        <strong>${escapeHTML(value || "—")}</strong>
      </div>
    `;
  }

  function openSellerDetails(seller) {
    const status = normalizedStatus(seller.status);
    const role = profileRoles.get(seller.user_id);

    const date = seller.created_at
      ? new Date(seller.created_at).toLocaleString()
      : "—";

    sellerDetails.innerHTML = [
      addDetail(
        "Store Name",
        seller.store_name || seller.business_name
      ),
      addDetail("Owner Name", seller.owner_name),
      addDetail("Phone", seller.phone),
      addDetail("Email", seller.email),
      addDetail("Country", seller.country),
      addDetail("Region", seller.region),
      addDetail("District", seller.district),
      addDetail("City", seller.city),
      addDetail("Street", seller.street),
      addDetail("Address", seller.address),
      addDetail("Category", seller.category),
      addDetail("TIN Number", seller.tin_number),
      addDetail("ID Type", seller.id_type),
      addDetail("ID Number", seller.id_number),
      addDetail("Application Status", status),
      addDetail("Account Role", role || "Unknown"),
      addDetail("Application Date", date)
    ].join("");

    let buttons = "";

    if (status === "pending") {
      buttons += `
        <button
          class="modal-reject"
          type="button"
          data-action="reject"
          data-id="${escapeHTML(seller.id)}">
          Reject
        </button>

        <button
          class="modal-approve"
          type="button"
          data-action="approve"
          data-id="${escapeHTML(seller.id)}">
          Approve & Activate
        </button>
      `;
    }

    if (status === "approved" && role !== "vendor") {
      buttons += `
        <button
          class="modal-activate"
          type="button"
          data-action="approve"
          data-id="${escapeHTML(seller.id)}">
          Activate Vendor Account
        </button>
      `;
    }

    modalActions.innerHTML = buttons;

    document
      .getElementById("sellerModal")
      .classList.add("show");
  }

  function closeModal() {
    modal.classList.remove("show");
  }

  // =====================================================
  // 10. APPROVE AND ACTIVATE VENDOR
  // =====================================================

  async function updateSellerStatus(id, newStatus) {
    if (isUpdating) return;

    if (!["approved", "rejected"].includes(newStatus)) {
      return;
    }

    const seller = sellers.find(
      item => String(item.id) === String(id)
    );

    if (!seller) {
      showMessage(
        "Seller application was not found.",
        "error"
      );
      return;
    }

    const currentStatus = normalizedStatus(seller.status);
    const currentRole = profileRoles.get(seller.user_id);

    if (newStatus === "rejected" && currentStatus !== "pending") {
      showMessage(
        "Only pending applications can be rejected.",
        "error"
      );
      return;
    }

    if (
      newStatus === "approved" &&
      !["pending", "approved"].includes(currentStatus)
    ) {
      showMessage(
        "This application cannot be approved.",
        "error"
      );
      return;
    }

    if (
      newStatus === "approved" &&
      currentStatus === "approved" &&
      currentRole === "vendor"
    ) {
      showMessage(
        "This account is already an active vendor."
      );
      return;
    }

    const storeName =
      seller.store_name ||
      seller.business_name ||
      "this seller";

    const confirmed = window.confirm(
      newStatus === "approved"
        ? `Approve and activate the Vendor Account for ${storeName}?`
        : `Are you sure you want to reject ${storeName}?`
    );

    if (!confirmed) return;

    isUpdating = true;
    hideMessage();

    try {
      const isAdmin = await verifyAdmin();

      if (!isAdmin) return;

      showMessage(
        "Processing seller application...",
        "info"
      );

      if (newStatus === "approved") {

        // APPROVE + ACTIVATE ACCOUNT USING DATABASE FUNCTION

        const {
          data,
          error
        } = await client.rpc(
          "approve_seller_application",
          {
            p_application_id: id
          }
        );

        if (error) {
          throw error;
        }

        if (!data || data.success !== true) {
          throw new Error(
            "Vendor activation was not confirmed by the database."
          );
        }

      } else {

        // REJECT APPLICATION

        const {
          data,
          error
        } = await client
          .from("seller_applications")
          .update({
            status: "rejected"
          })
          .eq("id", id)
          .eq("status", "pending")
          .select("id, status")
          .maybeSingle();

        if (error) {
          throw error;
        }

        if (!data) {
          throw new Error(
            "Application was not updated. It may already have been reviewed or permissions may be missing."
          );
        }
      }

      closeModal();

      // Refresh applications and profile roles
      await loadSellers();

      showMessage(
        newStatus === "approved"
          ? `${storeName} approved. Vendor account activation completed.`
          : `${storeName} application rejected.`
      );

    } catch (error) {
      console.error(
        "ZUNE Seller action error:",
        error
      );

      showMessage(
        "Operation failed: " +
        (error.message || "Unknown error"),
        "error"
      );

    } finally {
      isUpdating = false;
    }
  }

  // =====================================================
  // 11. ACTION HANDLER
  // =====================================================

  async function handleAction(event) {
    const button = event.target.closest(
      "button[data-action]"
    );

    if (!button) return;

    if (isUpdating) return;

    const action = button.dataset.action;
    const id = button.dataset.id;

    if (!id) return;

    if (action === "view") {
      const seller = sellers.find(
        item => String(item.id) === String(id)
      );

      if (seller) {
        openSellerDetails(seller);
      }

      return;
    }

    if (action === "approve") {
      await updateSellerStatus(id, "approved");
      return;
    }

    if (action === "reject") {
      await updateSellerStatus(id, "rejected");
    }
  }

  // =====================================================
  // 12. EVENT LISTENERS
  // =====================================================

  search.addEventListener(
    "input",
    applyFilters
  );

  statusFilter.addEventListener(
    "change",
    applyFilters
  );

  refreshBtn.addEventListener(
    "click",
    loadSellers
  );

  table.addEventListener(
    "click",
    handleAction
  );

  modalActions.addEventListener(
    "click",
    handleAction
  );

  closeModalBtn.addEventListener(
    "click",
    closeModal
  );

  modal.addEventListener(
    "click",
    event => {
      if (event.target === modal) {
        closeModal();
      }
    }
  );

  document.addEventListener(
    "keydown",
    event => {
      if (event.key === "Escape") {
        closeModal();
      }
    }
  );

  // =====================================================
  // 13. INITIALIZE SUPABASE
  // =====================================================

  try {
    if (
      !window.supabase ||
      !window.SUPABASE_URL ||
      !window.SUPABASE_ANON_KEY
    ) {
      throw new Error(
        "Supabase configuration is missing. Check ../js/config.js."
      );
    }

    client = window.supabase.createClient(
      window.SUPABASE_URL,
      window.SUPABASE_ANON_KEY,
      {
        auth: {
          persistSession: true,
          autoRefreshToken: true,
          detectSessionInUrl: true
        }
      }
    );

    await loadSellers();

  } catch (error) {
    console.error(
      "ZUNE Sellers initialization error:",
      error
    );

    showMessage(
      error.message ||
      "Unable to initialize Sellers Management.",
      "error"
    );
  }

});
</script>
