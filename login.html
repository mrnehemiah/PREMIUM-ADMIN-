<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#087a43">
  <title>Admin Login | ZUNE PREMIUM</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #f4f8f5;
      padding: 20px;
    }

    .login-card {
      width: 100%;
      max-width: 420px;
      background: #fff;
      padding: 35px 28px;
      border-radius: 18px;
      box-shadow: 0 10px 35px rgba(0,0,0,.08);
      border-top: 5px solid #d5a52e;
    }

    .brand {
      text-align: center;
      margin-bottom: 28px;
    }

    .brand-icon {
      width: 65px;
      height: 65px;
      margin: auto auto 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 50%;
      background: #087a43;
      color: white;
      font-size: 30px;
      font-weight: bold;
      border: 3px solid #d5a52e;
    }

    .brand h1 {
      color: #087a43;
      font-size: 23px;
    }

    .brand p {
      color: #777;
      font-size: 13px;
      margin-top: 7px;
    }

    .login-card h2 {
      color: #183b29;
      font-size: 20px;
      margin-bottom: 8px;
    }

    .description {
      color: #777;
      font-size: 13px;
      margin-bottom: 25px;
    }

    label {
      display: block;
      color: #333;
      font-size: 13px;
      font-weight: bold;
      margin-bottom: 8px;
    }

    input {
      width: 100%;
      padding: 14px;
      border: 1px solid #ddd;
      border-radius: 9px;
      outline: none;
      font-size: 15px;
      margin-bottom: 19px;
    }

    input:focus {
      border-color: #087a43;
      box-shadow: 0 0 0 3px rgba(8,122,67,.08);
    }

    button {
      width: 100%;
      padding: 15px;
      border: none;
      border-radius: 9px;
      background: #087a43;
      color: white;
      font-size: 15px;
      font-weight: bold;
      cursor: pointer;
    }

    button:disabled {
      opacity: .6;
      cursor: not-allowed;
    }

    #loginMessage {
      display: none;
      margin-top: 17px;
      padding: 12px;
      border-radius: 8px;
      font-size: 13px;
      line-height: 1.5;
    }

    .security {
      text-align: center;
      color: #888;
      font-size: 11px;
      margin-top: 25px;
    }

    .gold {
      color: #b58a19;
    }
  </style>
</head>

<body>

  <main class="login-card">

    <div class="brand">
      <div class="brand-icon">Z</div>
      <h1>ZUNE PREMIUM</h1>
      <p>ADMINISTRATION PORTAL</p>
    </div>

    <h2>Admin Sign In</h2>
    <p class="description">
      Sign in using your authorized administrator account.
    </p>

    <form id="adminLoginForm">

      <label for="email">Email Address</label>
      <input
        type="email"
        id="email"
        placeholder="Enter admin email"
        autocomplete="username"
        required
      >

      <label for="password">Password</label>
      <input
        type="password"
        id="password"
        placeholder="Enter your password"
        autocomplete="current-password"
        required
      >

      <button type="submit" id="loginButton">
        Sign In Securely
      </button>

      <div id="loginMessage" role="alert"></div>

    </form>

    <p class="security">
      <span class="gold">◆</span>
      Secure Administrator Access
    </p>

  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/config.js"></script>
<script src="js/login.js"></script>

</body>
</html>
